<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่งการบ้าน - Classroom System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #F8FAFC;
      margin: 0;
      padding: 1.5rem;
      font-family: 'Prompt', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .submit-card-wrapper {
      max-width: 580px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 32px;
      padding: 2.2rem;
      border: 1px solid #E2E8F0;
      box-shadow: 0 20px 45px rgba(0,0,0,0.04);
    }
    .submit-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .timer-pill {
      background: #ECFDF5;
      color: #059669;
      border: 1px solid #A7F3D0;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .session-select-pill {
      border: 1.5px solid #CBD5E1;
      background: #FFFFFF;
      color: #1E1B4B;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'Prompt', sans-serif;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .session-select-pill:hover {
      border-color: #6366F1;
    }
    .notice-box {
      background: #FFFBEB;
      border: 1.5px solid #FDE68A;
      border-radius: 18px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      color: #92400E;
      font-size: 0.88rem;
    }
    .input-field-custom {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border-radius: 16px;
      border: 1.5px solid #E2E8F0;
      font-size: 1.05rem;
      font-family: 'Prompt', sans-serif;
      outline: none;
      box-sizing: border-box;
      margin-top: 0.3rem;
      transition: all 0.2s;
    }
    .input-field-custom:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .dropzone-box {
      border: 2px dashed #CBD5E1;
      border-radius: 20px;
      padding: 2.2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      background: #F8FAFC;
      transition: all 0.2s;
      margin-top: 0.3rem;
    }
    .dropzone-box:hover {
      border-color: #6366F1;
      background: #EEF2FF;
    }
  </style>
</head>
<body>

  <div class="submit-card-wrapper">
    <!-- แถบด้านบน: ป้ายบอกเวลา + Dropdown สลับสัปดาห์ส่งงาน -->
    <div class="submit-top-header">
      <div id="countdownBadge" class="timer-pill">กำลังโหลดข้อมูล...</div>
      <div>
        <select id="submitSessionSelect" class="session-select-pill" onchange="onSessionChange()"></select>
      </div>
    </div>

    <!-- หัวข้อหน้าส่งการบ้าน -->
    <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.2rem;">
      <span style="font-size: 1.8rem;">📤</span>
      <h2 style="font-size: 1.65rem; font-weight: 800; color: #1E1B4B; margin: 0;">ส่งการบ้าน</h2>
    </div>

    <!-- กล่องแจ้งรูปแบบชื่อไฟล์ -->
    <div class="notice-box">
      <div style="font-weight: 700; margin-bottom: 0.2rem;">📌 ชื่อไฟล์: ตั้งชื่อไฟล์ให้ตรงตามรูปแบบ</div>
      <div style="font-weight: 800; color: #B45309;">[รหัสนักศึกษา] - [ชื่อ นามสกุล].[นามสกุลไฟล์]</div>
    </div>

    <!-- รหัสนักศึกษา -->
    <div style="margin-bottom: 1.2rem;">
      <label style="font-size: 0.9rem; font-weight: 700; color: #1E1B4B;">รหัสนักศึกษา (10 หลัก):</label>
      <input type="text" id="submitStudentId" maxlength="10" placeholder="เช่น 6730611001" class="input-field-custom" oninput="checkSubmitStudentId()">
    </div>

    <!-- ชื่อ - นามสกุล -->
    <div style="margin-bottom: 1.2rem;">
      <label style="font-size: 0.9rem; font-weight: 700; color: #1E1B4B;">ชื่อ - นามสกุล:</label>
      <input type="text" id="submitStudentName" placeholder="ระบบจะแสดงอัตโนมัติ" class="input-field-custom" readonly style="background: #F1F5F9; color: #475569; font-weight: 600;">
    </div>

    <!-- เลือกไฟล์ชิ้นงาน -->
    <div style="margin-bottom: 1.5rem;">
      <label style="font-size: 0.9rem; font-weight: 700; color: #1E1B4B;">เลือกไฟล์ชิ้นงาน:</label>
      <input type="file" id="homeworkFileInput" style="display: none;" onchange="handleFileSelect(event)">
      <div class="dropzone-box" onclick="document.getElementById('homeworkFileInput').click()">
        <div style="font-size: 2.2rem; margin-bottom: 0.4rem;">📄</div>
        <div id="dropzoneText" style="font-size: 1rem; font-weight: 700; color: #1E1B4B;">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</div>
        <div style="font-size: 0.8rem; color: #64748B; margin-top: 0.2rem;">(ระบบจะส่งไฟล์ตรงเข้าโฟลเดอร์ของอาจารย์ทันที)</div>
      </div>
    </div>

    <!-- ปุ่มกดยืนยันส่งงาน -->
    <button id="btnSubmitHomework" onclick="uploadHomeworkFile()" style="width: 100%; padding: 0.95rem; border-radius: 9999px; border: none; background: #4338CA; color: white; font-size: 1.05rem; font-weight: 800; cursor: pointer; font-family: 'Prompt', sans-serif; box-shadow: 0 10px 25px rgba(67, 56, 202, 0.35);">
      🚀 อัปโหลดส่งการบ้านเดี๋ยวนี้
    </button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/submit.js"></script>
</body>
</html>
